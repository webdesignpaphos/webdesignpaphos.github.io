<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Webdesign Paphos</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;

      color: #fff;
      min-height: 100vh;
      display: flex;

      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    svg { margin-bottom: 1.5rem; }
    h1 { font-size: 2.25rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 1rem; }
    p { color: rgba(255,255,255,0.6); font-size: 1.05rem; line-height: 1.7; max-width: 44ch; margin-bottom: 2rem; }
    a {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      background: #14b8a6;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
    }
    a:hover { background: #0d9488; }

<body>
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="11" stroke="#14b8a6" stroke-width="1.5"/>
